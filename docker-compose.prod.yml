# ===========================================
# n8n Production Environment
# ===========================================
# Complete production setup with SSL, reverse proxy, and security
# Usage: docker-compose -f docker-compose.prod.yml up -d

version: '3.8'

networks:
  n8n:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local
  certbot_data:
    driver: local
  nginx_logs:
    driver: local

services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n_postgres
    restart: unless-stopped
    networks:
      - n8n
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: n8n_redis
    restart: unless-stopped
    networks:
      - n8n
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-1.104.0}
    container_name: n8n_app
    restart: unless-stopped
    networks:
      - n8n
    # No direct port exposure - nginx handles all traffic
    environment:
      # Production Mode
      - NODE_ENV=production
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      - N8N_LOG_OUTPUT=console
      
      # Database Configuration
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=${POSTGRES_SCHEMA:-public}
      
      # Redis Configuration (Queue Management)
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_DB=0
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      
      # Security Configuration
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_USER_MANAGEMENT_DISABLED=${N8N_USER_MANAGEMENT_DISABLED:-false}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      
      # Server Configuration (behind nginx proxy)
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}
      - N8N_PROXY_TRUST_ALL_HOSTS=true
      
      # User Management & Authentication
      - N8N_OWNER_EMAIL=${N8N_OWNER_EMAIL}
      - N8N_OWNER_PASSWORD=${N8N_OWNER_PASSWORD}
      - N8N_SIGNUP_ALLOWED=${N8N_SIGNUP_ALLOWED:-false}
      - N8N_USER_PASSWORD_MIN_LENGTH=${N8N_USER_PASSWORD_MIN_LENGTH:-8}
      - N8N_USER_PASSWORD_COMPLEXITY=${N8N_USER_PASSWORD_COMPLEXITY:-true}
      
      # Email Configuration (for user invitations)
      - N8N_EMAIL_MODE=${N8N_EMAIL_MODE:-smtp}
      - N8N_SMTP_HOST=${N8N_SMTP_HOST}
      - N8N_SMTP_PORT=${N8N_SMTP_PORT:-587}
      - N8N_SMTP_USER=${N8N_SMTP_USER}
      - N8N_SMTP_PASS=${N8N_SMTP_PASS}
      - N8N_SMTP_SENDER=${N8N_SMTP_SENDER}
      - N8N_SMTP_SSL=${N8N_SMTP_SSL:-true}
      
      # SAML SSO Configuration (Optional)
      - N8N_SAML_ENABLED=${N8N_SAML_ENABLED:-false}
      - N8N_SAML_ENTITY_ID=${N8N_SAML_ENTITY_ID}
      - N8N_SAML_ASSERT_URL=${N8N_SAML_ASSERT_URL}
      - N8N_SAML_METADATA_URL=${N8N_SAML_METADATA_URL}
      - N8N_SAML_EMAIL_ATTRIBUTE=${N8N_SAML_EMAIL_ATTRIBUTE}
      - N8N_SAML_FIRST_NAME_ATTRIBUTE=${N8N_SAML_FIRST_NAME_ATTRIBUTE}
      - N8N_SAML_LAST_NAME_ATTRIBUTE=${N8N_SAML_LAST_NAME_ATTRIBUTE}
      - N8N_SAML_SIGNED_RESPONSE=${N8N_SAML_SIGNED_RESPONSE:-true}
      - N8N_SAML_SIGNED_ASSERTION=${N8N_SAML_SIGNED_ASSERTION:-true}
      - N8N_SAML_LOGIN_ENABLED=${N8N_SAML_LOGIN_ENABLED:-true}
      - N8N_SAML_LOGIN_LABEL=${N8N_SAML_LOGIN_LABEL:-Sign in with Microsoft}
      - N8N_SAML_ROLE_MAPPING_ENABLED=${N8N_SAML_ROLE_MAPPING_ENABLED:-false}
      - N8N_SAML_ROLE_OWNER_GROUPS=${N8N_SAML_ROLE_OWNER_GROUPS}
      - N8N_SAML_ROLE_ADMIN_GROUPS=${N8N_SAML_ROLE_ADMIN_GROUPS}
      - N8N_SAML_ROLE_MEMBER_GROUPS=${N8N_SAML_ROLE_MEMBER_GROUPS}
      
      # Performance & Monitoring
      - N8N_METRICS=${N8N_METRICS:-true}
      - EXECUTIONS_DATA_PRUNE=${EXECUTIONS_DATA_PRUNE:-true}
      - EXECUTIONS_DATA_MAX_AGE=${EXECUTIONS_DATA_MAX_AGE:-168}
      - EXECUTIONS_DATA_SAVE_ON_ERROR=${EXECUTIONS_DATA_SAVE_ON_ERROR:-all}
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=${EXECUTIONS_DATA_SAVE_ON_SUCCESS:-first}
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=${EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS:-true}
      
      # Workflow Settings
      - WORKFLOWS_DEFAULT_NAME=${WORKFLOWS_DEFAULT_NAME:-My workflow}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_BINARY_DATA_TTL=${N8N_BINARY_DATA_TTL:-1440}
      
      # Timezone
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Ho_Chi_Minh}  
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  nginx:
    image: nginx:1.25-alpine
    container_name: n8n_nginx
    restart: unless-stopped
    networks:
      - n8n
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${N8N_HOST}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_data:/etc/letsencrypt:ro
      - ./nginx/html:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - n8n
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    command: |
      sh -c '
        # Replace environment variables in nginx config
        envsubst "$$DOMAIN_NAME" < /etc/nginx/nginx.conf > /tmp/nginx.conf && 
        mv /tmp/nginx.conf /etc/nginx/nginx.conf &&
        nginx -g "daemon off;"
      '

  certbot:
    image: certbot/certbot:latest
    container_name: n8n_certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - ./nginx/html:/var/www/certbot
    environment:
      - DOMAIN_NAME=${N8N_HOST}
      - SSL_EMAIL=${SSL_EMAIL}
    command: |
      sh -c '
        echo "Waiting for nginx to start...";
        sleep 60;
        if [ ! -f /etc/letsencrypt/live/${N8N_HOST}/fullchain.pem ]; then
          echo "Obtaining SSL certificate for ${N8N_HOST}...";
          certbot certonly --webroot --webroot-path=/var/www/certbot --email ${SSL_EMAIL} --agree-tos --no-eff-email -d ${N8N_HOST};
        else
          echo "SSL certificate already exists for ${N8N_HOST}";
        fi;
        # Keep container running for automatic renewals
        while :; do
          sleep 12h;
          echo "Checking for certificate renewal...";
          certbot renew --quiet;
        done;
      '
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M 