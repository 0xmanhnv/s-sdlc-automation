version: '3.8'

networks:
  n8n-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local
  certbot_data:
    driver: local
  nginx_logs:
    driver: local

services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n_postgres
    restart: unless-stopped
    networks:
      - n8n-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: n8n_redis
    restart: unless-stopped
    networks:
      - n8n-network
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-1.104.0}
    container_name: n8n_app
    restart: unless-stopped
    networks:
      - n8n-network
    # Remove direct port exposure - nginx will handle it
    # ports:
    #   - "${N8N_PORT:-5678}:5678"
    environment:
      # Database Configuration
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=${POSTGRES_SCHEMA:-public}
      
      # Redis Configuration
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_DB=0
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      
      # Security Configuration
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      
      # Server Configuration (behind nginx proxy)
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
      - WEBHOOK_URL=${WEBHOOK_URL:-https://localhost}
      
      # Timezone Configuration
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Ho_Chi_Minh}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      
      # Performance & Monitoring
      - N8N_METRICS=${N8N_METRICS:-true}
      - EXECUTIONS_DATA_PRUNE=${EXECUTIONS_DATA_PRUNE:-true}
      - EXECUTIONS_DATA_MAX_AGE=${EXECUTIONS_DATA_MAX_AGE:-168}
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      - N8N_LOG_OUTPUT=${N8N_LOG_OUTPUT:-console}
      
      # Workflow Settings
      - WORKFLOWS_DEFAULT_NAME=${WORKFLOWS_DEFAULT_NAME:-My workflow}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      
      # Trust proxy (important for nginx)
      - N8N_PROXY_TRUST_ALL_HOSTS=true
      
      # SAML Configuration (if enabled)
      - N8N_SAML_ENABLED=${N8N_SAML_ENABLED:-false}
      - N8N_SAML_ENTITY_ID=${N8N_SAML_ENTITY_ID}
      - N8N_SAML_ASSERT_URL=${N8N_SAML_ASSERT_URL}
      - N8N_SAML_METADATA_URL=${N8N_SAML_METADATA_URL}
      - N8N_SAML_EMAIL_ATTRIBUTE=${N8N_SAML_EMAIL_ATTRIBUTE}
      - N8N_SAML_FIRST_NAME_ATTRIBUTE=${N8N_SAML_FIRST_NAME_ATTRIBUTE}
      - N8N_SAML_LAST_NAME_ATTRIBUTE=${N8N_SAML_LAST_NAME_ATTRIBUTE}
      - N8N_SAML_SIGNED_RESPONSE=${N8N_SAML_SIGNED_RESPONSE:-true}
      - N8N_SAML_SIGNED_ASSERTION=${N8N_SAML_SIGNED_ASSERTION:-true}
      - N8N_SAML_LOGIN_ENABLED=${N8N_SAML_LOGIN_ENABLED:-true}
      - N8N_SAML_LOGIN_LABEL=${N8N_SAML_LOGIN_LABEL:-Sign in with Microsoft}
      
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  nginx:
    image: nginx:1.25-alpine
    container_name: n8n_nginx
    restart: unless-stopped
    networks:
      - n8n-network
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${N8N_HOST:-localhost}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_data:/etc/letsencrypt:ro
      - ./nginx/html:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - n8n
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    command: |
      sh -c '
        # Replace environment variables in nginx config
        envsubst "$$DOMAIN_NAME" < /etc/nginx/nginx.conf > /tmp/nginx.conf && 
        mv /tmp/nginx.conf /etc/nginx/nginx.conf &&
        nginx -g "daemon off;"
      '

  certbot:
    image: certbot/certbot:latest
    container_name: n8n_certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - ./nginx/html:/var/www/certbot
    command: |
      sh -c '
        echo "Waiting for nginx to start...";
        sleep 30;
        if [ ! -f /etc/letsencrypt/live/${N8N_HOST:-localhost}/fullchain.pem ]; then
          echo "Obtaining SSL certificate for ${N8N_HOST:-localhost}...";
          certbot certonly --webroot --webroot-path=/var/www/certbot --email ${SSL_EMAIL:-admin@${N8N_HOST:-localhost}} --agree-tos --no-eff-email -d ${N8N_HOST:-localhost};
        else
          echo "SSL certificate already exists";
        fi;
        # Keep container running for renewals
        while :; do
          sleep 12h;
          certbot renew --quiet;
        done;
      '
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M 