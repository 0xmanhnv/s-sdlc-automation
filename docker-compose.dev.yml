# ===========================================
# n8n Development Environment
# ===========================================
# Simplified setup for local development
# Usage: docker-compose -f docker-compose.dev.yml up -d

version: '3.8'

networks:
  n8n:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local

services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n_postgres
    restart: unless-stopped 
    networks:
      - n8n
#    ports:
#      - "${POSTGRES_PORT:-5432}:5432"  # Expose for debugging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-n8n_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n_dev} -d ${POSTGRES_DB:-n8n_dev}"]
      interval: 10s
      timeout: 5s
      retries: 3

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-1.104.0}
    container_name: n8n_app
    restart: unless-stopped
    networks:
      - n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # Development Mode
      - NODE_ENV=development
      - N8N_LOG_LEVEL=debug
      - N8N_LOG_OUTPUT=console
      
      # Database Configuration
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n_dev}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n_dev}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_dev_pass}
      
      # Security (Basic for dev)
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-dev-key-32-chars-minimum-required}
      - N8N_USER_MANAGEMENT_DISABLED=${N8N_USER_MANAGEMENT_DISABLED:-true}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      
      # Server Configuration
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:${N8N_PORT:-5678}
      
      # Development Features
      - N8N_DISABLE_PRODUCTION_MAIN_PROCESS=false
      - N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN=true
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      
      # Timezone
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
      
    volumes:
      - n8n_data:/home/node/.n8n
      # Mount local workflows for development (optional)
      # - ./workflows:/home/node/.n8n/workflows:rw
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3 