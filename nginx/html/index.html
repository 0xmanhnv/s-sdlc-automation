<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n8n Setup</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        .logo {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        h1 {
            margin: 0 0 1rem 0;
            font-size: 2rem;
        }
        p {
            margin: 0.5rem 0;
            opacity: 0.9;
        }
        .status {
            margin-top: 2rem;
            padding: 1rem;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔧</div>
        <h1>n8n Setup in Progress</h1>
        <p>Your n8n workflow automation platform is being configured.</p>
        <p>This page will be replaced once setup is complete.</p>
        
        <div class="status">
            <p><strong>Status:</strong> Configuring SSL certificates and services...</p>
            <p><strong>Domain:</strong> <span id="domain">Loading...</span></p>
        </div>
        
        <p style="margin-top: 2rem; font-size: 0.9rem; opacity: 0.7;">
            If you see this page, nginx is working correctly.
        </p>
    </div>

    <script>
        // Show current domain
        document.getElementById('domain').textContent = window.location.hostname;
        
        // Auto-refresh every 30 seconds during setup
        setTimeout(() => {
            window.location.reload();
        }, 30000);
    </script>
</body>
</html>
