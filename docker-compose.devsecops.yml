# ===========================================
# n8n DevSecOps Environment
# ===========================================
# Pre-configured setup for DevSecOps teams with built-in workers
# Usage: docker-compose -f docker-compose.devsecops.yml up -d

version: '3.8'

networks:
  n8n:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local
  certbot_data:
    driver: local
  nginx_logs:
    driver: local

services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n_postgres
    restart: unless-stopped
    networks:
      - n8n
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: n8n_redis
    restart: unless-stopped
    networks:
      - n8n
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 1024mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ===========================================
  # MAIN INSTANCE - DevSecOps Command Center
  # ===========================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-1.104.0}
    container_name: n8n_app
    restart: unless-stopped
    networks:
      - n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # DevSecOps Mode - Always queue enabled
      - NODE_ENV=production
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-debug}
      - N8N_LOG_OUTPUT=console
      
      # Database Configuration
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      
      # Queue Configuration - FORCED ON for DevSecOps
      - QUEUE_MODE=true
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_DB=0
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - N8N_QUEUE_HEALTH_CHECK_ACTIVE=true
      - N8N_QUEUE_HEALTH_CHECK_PORT=5678
      
      # Security Configuration
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_USER_MANAGEMENT_DISABLED=${N8N_USER_MANAGEMENT_DISABLED:-false}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      
      # Server Configuration
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}
      - N8N_PROXY_TRUST_ALL_HOSTS=true
      
      # DevSecOps Optimizations
      - N8N_METRICS=true
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      
      # New n8n 1.104.0+ Configuration
      - N8N_RUNNERS_ENABLED=true
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      
      # Timezone
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Ho_Chi_Minh}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ===========================================
  # WORKER 1 - SAST Processing
  # ===========================================
  n8n-worker-1:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-1.104.0}
    container_name: n8n_worker_1
    restart: unless-stopped
    networks:
      - n8n
    command: worker
    environment:
      # Worker Configuration
      - NODE_ENV=production
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-debug}
      - N8N_LOG_OUTPUT=console
      
      # Database Configuration
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      
      # Queue Configuration
      - QUEUE_MODE=true
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_DB=0
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - N8N_GRACEFUL_SHUTDOWN_TIMEOUT=${QUEUE_WORKER_TIMEOUT:-60}
      - N8N_QUEUE_RECOVERY_INTERVAL=${N8N_QUEUE_RECOVERY_INTERVAL:-60}
      
      # Security Configuration
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      
      # Worker Optimizations for SAST
      - N8N_METRICS=true
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      
      # Timezone
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Ho_Chi_Minh}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q n8n || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  # ===========================================
  # WORKER 2 - Security Automation
  # ===========================================
  n8n-worker-2:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-1.104.0}
    container_name: n8n_worker_2
    restart: unless-stopped
    networks:
      - n8n
    command: worker
    environment:
      # Worker Configuration
      - NODE_ENV=production
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-debug}
      - N8N_LOG_OUTPUT=console
      
      # Database Configuration
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      
      # Queue Configuration
      - QUEUE_MODE=true
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_DB=0
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - N8N_GRACEFUL_SHUTDOWN_TIMEOUT=${QUEUE_WORKER_TIMEOUT:-60}
      - N8N_QUEUE_RECOVERY_INTERVAL=${N8N_QUEUE_RECOVERY_INTERVAL:-60}
      
      # Security Configuration
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      
      # Worker Optimizations
      - N8N_METRICS=true
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      
      # Timezone
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Ho_Chi_Minh}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q n8n || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  # ===========================================  
  # NGINX REVERSE PROXY
  # ===========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: n8n_nginx
    restart: unless-stopped
    networks:
      - n8n
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${N8N_HOST}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./nginx/nginx.localhost.conf:/etc/nginx/nginx.localhost.conf:ro
      - certbot_data:/etc/letsencrypt:ro
      - ./nginx/html:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - n8n
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    command: |
      sh -c '
        if [ "$$DOMAIN_NAME" = "localhost" ]; then
          echo "Using HTTP-only config for localhost development";
          cp /etc/nginx/nginx.localhost.conf /etc/nginx/nginx.conf;
        else
          echo "Using SSL config for production domain: $$DOMAIN_NAME";
          envsubst "\$$DOMAIN_NAME" < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf;
        fi &&
        nginx -g "daemon off;"
      '

  # ===========================================
  # SSL CERTIFICATE MANAGEMENT
  # ===========================================
  certbot:
    image: certbot/certbot:latest
    container_name: n8n_certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - ./nginx/html:/var/www/certbot
    environment:
      - DOMAIN_NAME=${N8N_HOST}
      - SSL_EMAIL=${SSL_EMAIL}
    entrypoint: /bin/sh
    command: 
      - -c
      - |
        echo 'Waiting for nginx to start...'
        sleep 60
        if [ "$$N8N_HOST" != "localhost" ] && [ "$$N8N_HOST" != "127.0.0.1" ]; then
          if [ ! -f /etc/letsencrypt/live/$$N8N_HOST/fullchain.pem ]; then
            echo "Obtaining SSL certificate for $$N8N_HOST..."
            certbot certonly --webroot --webroot-path=/var/www/certbot --email $$SSL_EMAIL --agree-tos --no-eff-email -d $$N8N_HOST
          else
            echo "SSL certificate already exists for $$N8N_HOST"
          fi
          while true; do
            sleep 12h
            echo "Checking for certificate renewal..."
            certbot renew --quiet
          done
        else
          echo "Skipping SSL certificate for localhost ($$N8N_HOST)"
          echo "For development, use HTTP or configure a valid domain name"
          sleep infinity
        fi
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M 